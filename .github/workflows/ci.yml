name: CI — Syntax, Unit & Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          node --check game.js
          node --check editor.js
          node --check src/condition_parser.js
          node --check src/cloud_manifest_loader.js

      - name: Condition parser unit tests
        run: node --test tests/condition_parser.test.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Pillow
        run: |
          pip install --quiet playwright Pillow
          playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
